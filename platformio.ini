; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-core2]
platform = espressif32 
board = m5stack-core2
framework = arduino
monitor_speed = 115200

; Standardize the upload speed for faster development
upload_speed = 921600

lib_deps =
    m5stack/M5Unified @ 0.2.14
    vshymanskyy/TinyGSM @ 0.11.7
    mathworks/ThingSpeak @ 2.0.0
    arduino-libraries/ArduinoHttpClient @ 0.5.0

build_flags =
    ; --- Modem Settings ---
    -DTINY_GSM_MODEM_SIM7600
    -DTINY_GSM_RX_BUFFER=1024
    
    ; --- M5Unified / Debug Settings ---
    ; Set to 3 (Info) so M5_LOGI works. Set to 4 (Debug) or 5 (Verbose) for more detail.
    -DCORE_DEBUG_LEVEL=3
    
    ; --- Optimization ---
    ; Ensure the compiler handles the Core2's PSRAM correctly
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    
    ; Keep your error checking for clean code
    -Werror=return-type

; Source filter to ensure we aren't accidentally compiling old LVGL files
src_filter = +<*> -<.git/> -<.svn/> -<example/> -<examples/> -<test/>